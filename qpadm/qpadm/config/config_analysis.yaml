# =============================================================================
# UKB Ancestry × Phenotype Pipeline — Configuration
# =============================================================================

# ─── Paths ────────────────────────────────────────────────────────────────────
# Relative to the project folder (run Snakemake from there). Site-specific overrides
# (absolute paths, existing conda env) go into config/config_analysis.local.yaml.
results_dir: "results/analysis"

# ─── Admixture file ───────────────────────────────────────────────────────────
# qpAdm proportions of all UKB individuals: eid + one column per source population.
# qpadm_tables lists the tables written by Snakefile_qpadm.py (one per PLINK set);
# they are concatenated into admixture_file. Remove qpadm_tables to use an
# existing admixture_file as it is.
qpadm_tables:
  - "results/qpadm/final_output/aggregated_qpadm_all.tsv"
admixture_file: "results/analysis/aggregated_qpadm_all_merged.tsv"

ancestry_rename:
  Turkey_N:                  EF
  Russia_Samara_EBA_Yamnaya: Steppe
  Luxembourg_Loschbour.DG:   HG


# ─── Phenotype file groups ────────────────────────────────────────────────────
phenotype_files:

  phenotype:
    data:    "data/ukb/phenotype_data.tsv"
    chars:   "data/ukb/phenotype_chars.tsv"
    cbkeys:  "data/ukb/phenotype_cbkeys.tsv"

  touchscreen:
    data:    "data/ukb/touchscreen_data.tsv"
    chars:   "data/ukb/touchscreen_chars.tsv"
    cbkeys:  "data/ukb/touchscreen_cbkeys.tsv"

  FirstOccurrences:
    data:    "data/ukb/FirstOccurrences_data.tsv"
    chars:   "data/ukb/FirstOccurrences_chars.tsv"
    cbkeys:  "data/ukb/FirstOccurrences_cbkeys.tsv"

  popchar:
    data:    "data/ukb/popchar_data.tsv"
    chars:   "data/ukb/popchar_chars.tsv"
    cbkeys:  "data/ukb/popchar_cbkeys.tsv"

  metabolomics:
    data:    "data/ukb/metabolomics_data.tsv"
    chars:   "data/ukb/metabolomics_chars.tsv"
    cbkeys:  null

  physical_measures:
    data:    "data/ukb/Physical_measures_data.tsv"
    chars:   "data/ukb/Physical_measures_chars.json"
    cbkeys:  null


# ─── Covariate sets ───────────────────────────────────────────────────────────
covariate_sets:

  age_sex:
    age: 21022
    sex: 31

  age_sex_smoking_alcohol:
    age: 21022
    sex: 31
    smoking:
      field_id: 20116
      categorical: true
    alcohol:
      field_id: 20117
      categorical: true

  age_sex_smoking_alcohol_bmi:
    age: 21022
    sex: 31
    smoking:
      field_id: 20116
      categorical: true
    alcohol:
      field_id: 20117
      categorical: true
    bmi: 21001

  age_sex_income:
    age: 21022
    sex: 31
    income: 26411

  age_sex_lifestyle_pcs:
    age: 21022
    sex: 31
    lifestyle_PC1: lifestyle_pc
    lifestyle_PC2: lifestyle_pc
    lifestyle_PC3: lifestyle_pc
    lifestyle_PC4: lifestyle_pc
    lifestyle_PC5: lifestyle_pc


# ─── Lifestyle PCA ────────────────────────────────────────────────────────────
lifestyle_pca:
