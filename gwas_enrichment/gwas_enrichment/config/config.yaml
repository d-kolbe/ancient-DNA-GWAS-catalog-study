# Ancient Population Genetics GWAS Enrichment Pipeline
# Configuration File (SIMPLIFIED - Exact Match)
#
# All paths are relative to the project folder; run Snakemake from there.
# data/      external inputs that are not part of the repository (VCF, GWAS Catalog
#            file, CEU reference panel, positions file)
# resources/ small inputs that are part of the repository (sample lists, categories)
# Site-specific overrides (absolute paths, conda_env) go into config/config.local.yaml

# =============================================================================
# INPUT FILES
# =============================================================================

vcf: "data/Ancient_v3.Ostorf.Imputed.Phased.MAF5.vcf.gz"
hg_samples: "resources/HG_samples.txt"
ef_samples: "resources/EF_samples.txt"
positions: "data/ancient_pos.txt"
genome_build: "GRCh37"

# =============================================================================
# CATEGORY SYSTEM
# =============================================================================

categories_yaml: "resources/gwas_categories_v2.yaml"

# =============================================================================
# OUTPUT DIRECTORIES
# =============================================================================

output_dir: "results/v8"
stable_dir: "results/stable_resources"

# =============================================================================
# LD BLOCK PARAMETERS
# =============================================================================

ld:
  r2_threshold: 0.3
  window_kb: 250
  ref_panel: "data/1KG/CEU.MAC10"

  # Keep PLINK temp files (in stable_dir/tmp_ld_blocks) for inspection
  keep_temp: false

# =============================================================================
# GWAS CATALOG PARAMETERS
# =============================================================================

gwas:
  catalog_file: "data/gwas_catalog_GRCh37_augmented.tsv"
  min_pvalue: 5e-8
  require_risk_allele: true
  ancestry_filter:
    - "European"
    - "British"
    - "French"
    - "German"
    - "Italian"
    - "Spanish"
  strict_european_only: true
  min_snps_per_category: 30
  min_blocks_per_category: 5

# =============================================================================
# FST CALCULATION PARAMETERS
# =============================================================================

fst:
  weir_cockerham: true

# =============================================================================
# ENRICHMENT ANALYSIS PARAMETERS
# =============================================================================

enrichment:
  block_fst_metric: 'max'

  # Seed for the 10,000-point genome-wide background subsample written to
  # fst_distributions.txt (plotting only; the tests use all blocks)
  seed: 42

# =============================================================================
# TRAIT DECOMPOSITION PARAMETERS
# =============================================================================

trait_decomposition:
  category_fdr_threshold: 0.05
  directionality_top_n: 15
  directionality_rank_by: 'mannwhitneyu_pval'
  min_snps_per_trait: 20
  min_blocks_per_trait: 5
  apply_within_category_fdr: true
  trait_fdr_threshold: 0.05

# =============================================================================
# DIRECTIONALITY ANALYSIS PARAMETERS
# =============================================================================

directionality:
  min_snps_with_effects: 20
  skip_missing: true

# =============================================================================
# SNP SET EXPORT PARAMETERS
# =============================================================================

snp_sets:
  # Minimum number of SNPs a trait must have to be exported
  min_snps: 20

# =============================================================================
# SENSITIVITY ANALYSIS — TOP-SNP EXCLUSION
# =============================================================================

sensitivity:
  # Number of top SNPs (by |pgs_contribution|) to exclude per trait
  # before rerunning the directionality calculation.
  # Purpose: verify that the directionality signal is not driven by
  # a small number of high-contribution SNPs.
  exclude_top_n: 3

  # Minimum number of SNPs required after exclusion to run the analysis.
  # Traits falling below this threshold are skipped without error.
  min_snps_after_exclusion: 5

# =============================================================================
# BOOTSTRAP & JACKKNIFE CI PARAMETERS
# =============================================================================

bootstrap:
  # Number of bootstrap resampling iterations for both methods
  n_bootstrap: 1000

  # Confidence interval level
  ci_level: 0.95

  # Random seed for reproducibility
  seed: 42

  # Fraction of SNPs to drop per iteration in the delete-d dropout analysis
  # 0.10 = drop 10% of SNPs each time, recalculate Cohen's d on the remaining 90%
  snp_dropout_fraction: 0.10

# =============================================================================
# TRAIT GROUPS (COMBINED PGS ANALYSES)
# =============================================================================

trait_groups:
  - name: "IBD_combined"
    category: "Gastrointestinal - Inflammatory Bowel Disease"
    traits:
      - "Crohn's disease"
      - "Ulcerative colitis"
      - "Inflammatory bowel disease"

# =============================================================================
# NOTES FOR USERS
# =============================================================================

# IMPORTANT SETUP STEPS:
# 1. Ensure CEU reference panel has NO duplicate SNP IDs
#    - Check with: cut -f2 CEU.MAC10.bim | sort | uniq -d
#    - Fix with: plink --bfile CEU.MAC10 --rm-dup force-first --make-bed --out CEU.MAC10.dedup
#
# 2. Scripts required in scripts/:
#    - gwas_categories_v2.yaml
#    - category_utils.py
#    - extract_gwas_categories.py
#    - generate_category_ld_blocks.py
#    - merge_category_blocks.py
#    - quantitative_category_enrichment.py
#    - calculate_fst.py
#    - identify_significant_categories.py
#    - identify_directionality_categories.py
#    - decompose_category_traits.py
#    - merge_trait_enrichment.py
#    - calculate_trait_directionality.py
#    - calculate_trait_directionality_sensitivity.py
#    - calculate_directionality_bootstrap.py
#    - export_snp_sets.py
#    - generate_report.py
#
# DIRECTIONALITY SCOPE:
# - identify_significant_categories  → FDR-based, feeds only the HTML report
# - identify_directionality_categories → top-N by p-value, drives trait
#   decomposition, PGS calculation, and SNP contribution analysis