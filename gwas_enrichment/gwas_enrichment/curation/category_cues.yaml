# Keyword cues per category (Layer 1 of build_gwas_categories.py).
# Reconstructed from the frozen vocabulary by derive_category_cues.py; see that script.
# cue        : lower-case word or phrase, matched on word boundaries
# covers     : number of frozen members of this category containing the cue
# precision  : share of ALL frozen traits containing the cue that are members of this category
# Edit freely: add cues to raise recall, delete cues that over-assign.

# exclude   : collision guards learned by refine_cues_from_report.py from a real run;
#              a trait containing one of them is not assigned to this category by cues.

# exclude   : collision guards learned by refine_cues_from_report.py from a real run;
