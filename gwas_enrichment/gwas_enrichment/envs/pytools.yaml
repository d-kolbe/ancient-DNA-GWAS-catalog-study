# Minimal environment for the gwas_enrichment pipeline.
# Versions are taken from the environment used for the analysis; only packages
# that the scripts import or call are listed.
name: pytools
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.9
  - numpy=1.26.4
  - pandas=2.3.2
  - scipy=1.16.2
  - networkx=3.6.1
  - pyyaml=6.0.3
  - bcftools=1.21
  - vcftools=0.1.16
  - plink=1.90b7.7
